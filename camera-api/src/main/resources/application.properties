spring.application.name=demo
server.port=8080

# СР2: файлова база H2 у каталозі ./data відносно робочої директорії
spring.datasource.url=jdbc:h2:file:./data/cameradb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate створює/оновлює таблиці за Entity (лише для навчання; у продакшні — міграції)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Console — тільки локально
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Шлях списку камер на зовнішньому сервісі (база url — у @FeignClient)
camera.list.path=/da8f-feef-4b02-9ca0
